name: ARIES RTL simulation
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Compile RTL and testbench
        run: iverilog -g2012 -Wall -s tb_aries_sub_ns -o sim/aries_tb src/aries_sub_ns_core.v sim/tb_aries_sub_ns.v
      - name: Run simulation
        run: cd sim && vvp aries_tb
